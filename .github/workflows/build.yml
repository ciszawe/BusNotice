name: build-apk
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle --no-daemon assembleDebug testDebugUnitTest

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CommuteCapsule-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CommuteCapsule-${{ github.run_number }}
          path: CommuteCapsule-${{ github.run_number }}.apk

      # 发布到 Releases，手机浏览器可直接下载安装
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 通勤胶囊 build ${{ github.run_number }}
          files: CommuteCapsule-${{ github.run_number }}.apk
          prerelease: true
